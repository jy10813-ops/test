<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>빵 받기 - Bread Catch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF2E3;
    --cream-deep: #F2E4CC;
    --crust: #C9743A;
    --crust-dark: #A85A28;
    --wheat: #E8A94C;
    --brown: #5C3A22;
    --brown-deep: #3C2414;
    --miss: #B5474A;
    --good: #6F8B4C;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--brown-deep);
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at top, #5c3a22 0%, #2c1a0f 70%);
  }

  #stage {
    position: relative;
    width: min(94vw, 480px);
    aspect-ratio: 3 / 4.6;
    max-height: 96vh;
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.55),
      0 0 0 6px var(--brown),
      0 0 0 10px var(--wheat);
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 18px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
  }

  .hud-box {
    background: rgba(60, 36, 20, 0.88);
    color: var(--cream);
    padding: 8px 14px;
    border-radius: 12px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.2px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }

  #score-box .num {
    font-size: 19px;
    color: var(--wheat);
    margin-left: 4px;
  }

  #lives-box {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .crumb {
    width: 13px;
    height: 13px;
    border-radius: 50% 50% 45% 45%;
    background: var(--wheat);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
    transition: opacity 0.25s, transform 0.25s;
  }
  .crumb.lost {
    opacity: 0.18;
    transform: scale(0.6);
    background: #7a6448;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(60,36,20,0.94), rgba(30,17,9,0.97));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--cream);
    padding: 32px;
    z-index: 10;
    transition: opacity 0.3s ease;
  }

  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #overlay h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 800;
    color: var(--wheat);
    margin: 0 0 6px;
    letter-spacing: 0.5px;
  }

  #overlay .sub {
    font-size: 14.5px;
    line-height: 1.65;
    color: #E9D9BF;
    max-width: 300px;
    margin: 0 0 26px;
  }

  #overlay .sub b { color: var(--cream); }

  #final-score {
    font-family: 'Baloo 2', sans-serif;
    font-size: 17px;
    color: var(--cream);
    margin-bottom: 22px;
  }
  #final-score .n {
    font-size: 30px;
    color: var(--wheat);
    display: block;
  }

  button#play-btn {
    font-family: 'Baloo 2', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(180deg, var(--crust) 0%, var(--crust-dark) 100%);
    border: none;
    padding: 13px 34px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 5px 0 #7c3d18, 0 8px 18px rgba(0,0,0,0.35);
    transition: transform 0.08s ease;
  }
  button#play-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #7c3d18, 0 3px 8px rgba(0,0,0,0.35);
  }

  #hint {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(92, 58, 34, 0.55);
    font-weight: 600;
    z-index: 4;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-box" id="score-box">점수<span class="num" id="score-num">0</span></div>
    <div class="hud-box" id="lives-box"></div>
  </div>

  <div id="hint">← → 또는 마우스로 바구니 이동</div>

  <div id="overlay">
    <h1>🥖 빵 받기</h1>
    <p class="sub">하늘에서 내려오는 빵을 <b>바구니</b>로 받아보세요.<br>놓치면 목숨이 하나씩 줄어들어요.</p>
    <div id="final-score-wrap" style="display:none">
      <div id="final-score">최종 점수<span class="n" id="final-num">0</span></div>
    </div>
    <button id="play-btn">시작하기</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('play-btn');
  const scoreNum = document.getElementById('score-num');
  const finalNum = document.getElementById('final-num');
  const finalWrap = document.getElementById('final-score-wrap');
  const livesBox = document.getElementById('lives-box');

  let W, H, DPR;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    const rect = stage.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const MAX_LIVES = 3;
  let state = {
    running: false,
    score: 0,
    lives: MAX_LIVES,
    items: [],
    spawnTimer: 0,
    spawnInterval: 950,
    baseFallSpeed: 2.1,
    lastTime: 0,
    shake: 0,
    particles: [],
  };

  function renderLives() {
    livesBox.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
      const d = document.createElement('div');
      d.className = 'crumb' + (i >= state.lives ? ' lost' : '');
      livesBox.appendChild(d);
    }
  }

  // ---------- Basket ----------
  const basket = {
    w: 84,
    h: 46,
    x: 0,
    y: 0,
    targetX: 0,
  };

  function resetBasket() {
    basket.x = W / 2 - basket.w / 2;
    basket.targetX = basket.x;
    basket.y = H - basket.h - 18;
  }

  let keys = { left: false, right: false };
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === ' ' && !state.running) startGame();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  function pointerToBasket(clientX) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    basket.targetX = Math.min(Math.max(x - basket.w / 2, 6), W - basket.w - 6);
  }
  canvas.addEventListener('mousemove', (e) => pointerToBasket(e.clientX));
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    pointerToBasket(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('touchstart', (e) => pointerToBasket(e.touches[0].clientX));

  // ---------- Items (bread) ----------
  function spawnItem() {
    const r = Math.random();
    let type = 'bread';
    if (r < 0.12) type = 'burnt';       // 놓쳐도 되는 방해물 (피해야 함)
    else if (r < 0.22) type = 'golden'; // 보너스 빵

    const size = type === 'golden' ? 30 : 34;
    state.items.push({
      type,
      x: Math.random() * (W - size - 12) + 6,
      y: -size,
      size,
      speed: state.baseFallSpeed + Math.random() * 1.0 + state.score * 0.012,
      rot: (Math.random() - 0.5) * 0.3,
      rotSpeed: (Math.random() - 0.5) * 0.02,
      wobble: Math.random() * Math.PI * 2,
    });
  }

  function addParticles(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      state.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 4,
        vy: -Math.random() * 3 - 1,
        life: 1,
        color,
        size: Math.random() * 4 + 2,
      });
    }
  }

  // ---------- Drawing ----------
  function drawBackground() {
    // shop wall
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#FBF2E3');
    g.addColorStop(1, '#F2E4CC');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft shelf lines
    ctx.strokeStyle = 'rgba(92,58,34,0.06)';
    ctx.lineWidth = 2;
    for (let i = 1; i < 5; i++) {
      const y = (H / 5) * i;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // floor
    ctx.fillStyle = '#5C3A22';
    ctx.fillRect(0, H - 14, W, 14);
    ctx.fillStyle = '#4A2C1D';
    ctx.fillRect(0, H - 14, W, 4);
  }

  function drawBread(item) {
    const { x, y, size, rot } = item;
    ctx.save();
    ctx.translate(x + size / 2, y + size / 2);
    ctx.rotate(rot);

    if (item.type === 'burnt') {
      // 방해물: 그을린 빵
      ctx.fillStyle = '#4A3222';
      roundedLoaf(size);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, -size * 0.08, size * 0.32, size * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (item.type === 'golden') {
      ctx.fillStyle = '#F0B23D';
      roundedLoaf(size);
      ctx.strokeStyle = '#D9861F';
      ctx.lineWidth = 1.6;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * size * 0.18, -size * 0.22);
        ctx.lineTo(i * size * 0.18, size * 0.18);
        ctx.stroke();
      }
      // sparkle
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(size * 0.22, -size * 0.22, 2.4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#D9A15C';
      roundedLoaf(size);
      ctx.strokeStyle = '#B5793A';
      ctx.lineWidth = 1.6;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * size * 0.18, -size * 0.22);
        ctx.lineTo(i * size * 0.18, size * 0.18);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function roundedLoaf(size) {
    const w = size * 0.5, h = size * 0.36;
    ctx.beginPath();
    ctx.ellipse(0, 0, w, h, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBasket() {
    const { x, y, w, h } = basket;
    ctx.save();
    ctx.translate(x, y);

    // shadow
    ctx.fillStyle = 'rgba(60,36,20,0.18)';
    ctx.beginPath();
    ctx.ellipse(w / 2, h + 6, w * 0.48, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // basket body
    ctx.fillStyle = '#C9743A';
    ctx.beginPath();
    ctx.moveTo(6, h * 0.35);
    ctx.lineTo(w - 6, h * 0.35);
    ctx.lineTo(w - 12, h);
    ctx.lineTo(12, h);
    ctx.closePath();
    ctx.fill();

    // weave lines
    ctx.strokeStyle = 'rgba(60,36,20,0.35)';
    ctx.lineWidth = 1.4;
    for (let i = 1; i < 4; i++) {
      const yy = h * 0.35 + (h * 0.65) * (i / 4);
      ctx.beginPath();
      ctx.moveTo(6 + (i * 1.2), yy);
      ctx.lineTo(w - 6 - (i * 1.2), yy);
      ctx.stroke();
    }

    // rim
    ctx.fillStyle = '#A85A28';
    ctx.beginPath();
    ctx.ellipse(w / 2, h * 0.35, w / 2, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#7c3d18';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(w / 2, h * 0.35, w / 2, 7, 0, 0, Math.PI * 2);
    ctx.stroke();

    // handle
    ctx.strokeStyle = '#7c3d18';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(w / 2, h * 0.35, w * 0.34, Math.PI, 0);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    state.particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // ---------- Game loop ----------
  function update(dt) {
    // basket movement
    const speed = 0.62;
    if (keys.left) basket.targetX -= 7;
    if (keys.right) basket.targetX += 7;
    basket.targetX = Math.min(Math.max(basket.targetX, 6), W - basket.w - 6);
    basket.x += (basket.targetX - basket.x) * speed;

    // spawn
    state.spawnTimer += dt;
    const interval = Math.max(420, state.spawnInterval - state.score * 6);
    if (state.spawnTimer > interval) {
      state.spawnTimer = 0;
      spawnItem();
    }

    // items
    for (let i = state.items.length - 1; i >= 0; i--) {
      const it = state.items[i];
      it.y += it.speed;
      it.rot += it.rotSpeed;

      const caughtY = basket.y + 6;
      const inX = it.x + it.size * 0.5 > basket.x + 8 && it.x + it.size * 0.5 < basket.x + basket.w - 8;
      const inY = it.y + it.size * 0.5 > caughtY && it.y + it.size * 0.5 < caughtY + 22;

      if (inX && inY) {
        state.items.splice(i, 1);
        if (it.type === 'burnt') {
          loseLife();
          addParticles(it.x + it.size / 2, it.y, '#4A3222', 8);
        } else {
          const pts = it.type === 'golden' ? 3 : 1;
          state.score += pts;
          scoreNum.textContent = state.score;
          addParticles(it.x + it.size / 2, it.y, it.type === 'golden' ? '#F0B23D' : '#D9A15C', 10);
        }
        continue;
      }

      if (it.y > H + 20) {
        state.items.splice(i, 1);
        if (it.type !== 'burnt') loseLife();
      }
    }

    // particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life -= 0.035;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
  }

  function loseLife() {
    state.lives -= 1;
    renderLives();
    state.shake = 8;
    if (state.lives <= 0) {
      endGame();
    }
  }

  function render() {
    ctx.save();
    if (state.shake > 0) {
      const dx = (Math.random() - 0.5) * state.shake;
      const dy = (Math.random() - 0.5) * state.shake;
      ctx.translate(dx, dy);
      state.shake *= 0.85;
      if (state.shake < 0.5) state.shake = 0;
    }
    drawBackground();
    state.items.forEach(drawBread);
    drawBasket();
    drawParticles();
    ctx.restore();
  }

  function loop(t) {
    if (!state.running) return;
    const dt = t - (state.lastTime || t);
    state.lastTime = t;
    update(Math.min(dt, 40));
    render();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resize();
    resetBasket();
    state.running = true;
    state.score = 0;
    state.lives = MAX_LIVES;
    state.items = [];
    state.particles = [];
    state.spawnTimer = 0;
    state.lastTime = 0;
    scoreNum.textContent = '0';
    renderLives();
    finalWrap.style.display = 'none';
    overlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function endGame() {
    state.running = false;
    finalNum.textContent = state.score;
    finalWrap.style.display = 'block';
    playBtn.textContent = '다시하기';
    overlay.classList.remove('hidden');
  }

  playBtn.addEventListener('click', startGame);

  // initial paint
  resetBasket();
  renderLives();
  drawBackground();
  drawBasket();
})();
</script>
</body>
</html>
